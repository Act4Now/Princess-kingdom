<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8e6f6">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Princess Kingdom</title>
<style>
:root{--plum:#6f1688;--pink:#f8e6f6;--gold:#e8b34c}
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:#f8e6f6;
}
html{
  min-height:100%;
  -webkit-text-size-adjust:100%;
}
body{
  min-height:100vh;
  min-height:100svh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  overflow-x:hidden;
  background:
    radial-gradient(ellipse at 15% 20%,rgba(255,255,255,.42),transparent 35%),
    linear-gradient(180deg,#f8e6f6 0%,#f5e0f3 100%);
}
#game{
  position:relative;
  isolation:isolate;
  width:min(100vw,720px,75svh);
  width:min(100vw,720px,75dvh);
  max-width:100%;
  height:auto;
  aspect-ratio:3/4;
  flex:0 0 auto;
  margin:0 auto;
  overflow:hidden;
  background:#f8e6f6;
}
#art{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;z-index:0;user-select:none;-webkit-user-drag:none}
.hit{position:absolute;z-index:10;display:block;border:0;padding:0;margin:0;background:transparent;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hit:focus-visible{outline:3px solid #7a2192;outline-offset:2px;border-radius:22px}
/* Touch targets align with the four illustrated category buttons. */
#all{left:11.5%;top:21.3%;width:38%;height:10.4%}
#draw{left:51%;top:21.3%;width:38%;height:10.4%}
#mime{left:11.5%;top:32%;width:38%;height:10.3%}
#questions{left:51%;top:32%;width:38%;height:10.3%}
/* Single journal counter and single progress fill. */
#counter{position:absolute;z-index:5;left:69.5%;top:42.8%;width:18.0%;height:3.0%;
display:flex;align-items:center;justify-content:flex-end;color:var(--plum);
font-weight:800;font-size:clamp(13px,3.2vw,23px);white-space:nowrap;pointer-events:none}
#progress-track{position:absolute;z-index:4;left:12.4%;top:46.25%;width:75.8%;height:2.1%;
border-radius:999px;overflow:hidden;background:rgba(220,170,221,.78);box-shadow:inset 0 1px 2px rgba(105,35,120,.16);pointer-events:none}
#progress-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#9418a5,#c34fb7);transition:width .22s ease}
/* The original ornamental frame is part of the background; no extra card or oval is added. */
#challenge{position:absolute;z-index:3;left:17%;top:52.2%;width:66%;height:23.2%;
display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
padding:0 1.5%;overflow:hidden;color:var(--plum);}
#heading{font-family:Georgia,serif;font-weight:700;font-size:clamp(19px,4.5vw,32px);line-height:1.04;margin:0 0 1.3%;flex:none}
#emoji{font-size:clamp(48px,10.5vw,82px);line-height:1.0;flex:1 1 35%;min-height:0;display:flex;align-items:center;justify-content:center}
#label{font-family:Georgia,serif;font-weight:700;font-size:clamp(20px,5.2vw,38px);line-height:1.08;margin:0;max-width:100%;overflow-wrap:anywhere;flex:none}
#instruction{font-size:clamp(12px,2.8vw,19px);font-weight:700;font-style:italic;color:#8c3c98;line-height:1.12;margin-top:1.6%;max-width:100%;flex:none}
/* The action targets are on the two illustrated buttons, with one target per button. */
#success{left:9%;top:80.4%;width:43%;height:7.7%;border-radius:999px}
#next{left:51.5%;top:80.4%;width:40.5%;height:7.7%;border-radius:999px}
/* Adult-help button is already illustrated in the artwork; the message replaces it in place. */
#adult{left:7%;top:89.6%;width:86%;height:7.5%;border-radius:999px}
#adult-message{display:none;position:absolute;z-index:12;left:9%;top:89.7%;width:82%;height:7.1%;
align-items:center;justify-content:center;text-align:center;padding:1.2% 4%;
background:rgba(255,243,230,.98);color:#713b79;font-weight:700;
font-size:clamp(12px,2.9vw,19px);line-height:1.14;border:2px solid #e5b85f;border-radius:999px;overflow:hidden}
@media(max-width:390px){
 #heading{font-size:clamp(17px,4.5vw,20px)}
 #emoji{font-size:clamp(44px,10.5vw,58px)}
 #label{font-size:clamp(18px,5.1vw,23px)}
 #instruction{font-size:clamp(11px,2.8vw,13px)}
 #adult-message{font-size:clamp(10px,2.9vw,12px)}
}
@media(min-width:721px){#game{border-radius:14px}}
@media(prefers-reduced-motion:reduce){#progress-fill{transition:none}}
</style>
</head>

bare","emoji":"🌧️","task":"Ce cade din nori când plouă?","answer":"Picăturile de ploaie."},{"id":"q179","cat":"Întrebare","emoji":"❄️","task":"Ce cade iarna și este rece și alb?","answer":"Zăpada."},{"id":"q180","cat":"Întrebare","emoji":"🌬️","task":"Ce simțim când aerul se mișcă afară?","answer":"Vântul."},{"id":"q181","cat":"Întrebare","emoji":"🌞","task":"Cum este vremea când soarele strălucește?","answer":"Însorită."},{"id":"q182","cat":"Întrebare","emoji":"🌱","task":"Ce apare dintr-o sămânță când începe să crească?","answer":"Un vlăstar sau o plantă."},{"id":"q183","cat":"Întrebare","emoji":"🌻","task":"Ce floare galbenă mare se întoarce spre soare?","answer":"Floarea-soarelui."},{"id":"q184","cat":"Întrebare","emoji":"🌲","task":"Ce copac rămâne verde și iarna?","answer":"Bradul."},{"id":"q185","cat":"Întrebare","emoji":"🍂","task":"Ce se întâmplă cu multe frunze toamna?","answer":"Se îngălbenesc și cad."},{"id":"q186","cat":"Întrebare","emoji":"🌷","task":"În ce anotimp înfloresc multe flori?","answer":"Primăvara."},{"id":"q187","cat":"Întrebare","emoji":"🏖️","task":"Unde construim castele de nisip?","answer":"Pe plajă."},{"id":"q188","cat":"Întrebare","emoji":"⛄","task":"Ce putem construi din zăpadă?","answer":"Un om de zăpadă."},{"id":"q189","cat":"Întrebare","emoji":"🎈","task":"Ce obiect colorat se umflă și poate pluti în aer?","answer":"Un balon."},{"id":"q190","cat":"Întrebare","emoji":"🎁","task":"Ce primim uneori la ziua de naștere, împachetat frumos?","answer":"Un cadou."},{"id":"q191","cat":"Întrebare","emoji":"🎨","task":"Cu ce putem colora un desen?","answer":"Cu creioane colorate sau acuarele."},{"id":"q192","cat":"Întrebare","emoji":"⚽","task":"Cu ce ne jucăm și îl lovim cu piciorul?","answer":"Cu mingea."},{"id":"q193","cat":"Întrebare","emoji":"🧩","task":"Ce joc alcătuim potrivind piese?","answer":"Un puzzle."},{"id":"q194","cat":"Întrebare","emoji":"🪁","task":"Ce jucărie zboară în vânt, prinsă de o sfoară?","answer":"Un zmeu."},{"id":"q195","cat":"Întrebare","emoji":"🎵","task":"Ce auzim când cineva cântă?","answer":"Muzică."},{"id":"q196","cat":"Întrebare","emoji":"👏","task":"Ce facem cu palmele ca să aplaudăm?","answer":"Batem din palme."},{"id":"q197","cat":"Întrebare","emoji":"😊","task":"Cum ne simțim când primim o veste frumoasă?","answer":"Fericiți sau bucuroși."},{"id":"q198","cat":"Întrebare","emoji":"😴","task":"Ce facem când ne este somn?","answer":"Dormim."},{"id":"q199","cat":"Întrebare","emoji":"🤧","task":"Ce facem când ne vine să strănutăm?","answer":"Strănutăm."}];
const TOTAL=600;
const CAT={all:null,draw:'Desen',mime:'Mimă',questions:'Întrebare'};
const $=id=>document.getElementById(id);
let mode='all',active=null,seen=new Set(),done=new Set(),helpOpen=false;
const STORAGE='princess_kingdom_v9';
function loadState(){
 try{
  const s=JSON.parse(localStorage.getItem(STORAGE)||'null');
  if(s){
   done=new Set(Array.isArray(s.done)?s.done:[]);
   seen=new Set(Array.isArray(s.seen)?s.seen:[]);
  }else{
   // Migrate completion state from previous releases without inventing new progress.
   done=new Set(JSON.parse(localStorage.getItem('princess_done_v8')||localStorage.getItem('princess_done_v7')||'[]'));
   seen=new Set(JSON.parse(localStorage.getItem('princess_seen_v8')||localStorage.getItem('princess_seen_v7')||'[]'));
  }
 }catch(e){done=new Set();seen=new Set();}
}
function saveState(){
 try{localStorage.setItem(STORAGE,JSON.stringify({done:[...done],seen:[...seen]}));}catch(e){}
}
function updateProgress(){
 const count=Math.min(TOTAL,done.size);
 $('counter').textContent=count+' / '+TOTAL;
 $('progress-fill').style.width=(count/TOTAL*100)+'%';
 $('progress-track').setAttribute('aria-valuenow',String(count));
}
function getPool(){
 return BANK.filter(c=>!CAT[mode]||c.cat===CAT[mode]);
}
function closeHelp(){
 helpOpen=false;
 $('adult-message').style.display='none';
 $('adult-message').textContent='';
}
function renderChallenge(c){
 active=c;
 closeHelp();
 if(!c){
  $('heading').textContent='Provocarea ta';
  $('emoji').textContent='✨';
  $('label').textContent='Alege o categorie!';
  $('instruction').textContent='Atinge unul dintre cele patru butoane ale castelului.';
  return;
 }
 $('heading').textContent='Provocarea ta';
 $('emoji').textContent=c.emoji||'✨';
 if(c.cat==='Întrebare'){
  $('label').textContent=c.task;
  $('instruction').textContent='Răspunde!';
 }else{
  $('label').textContent=c.label||c.task;
  $('instruction').textContent=c.cat==='Desen'?'Desenează!':'Mimează fără să vorbești!';
 }
}
function nextChallenge(){
 const items=getPool();
 if(!items.length)return;
 let available=items.filter(c=>!seen.has(c.id));
 if(!available.length){
  for(const c of items)seen.delete(c.id);
  available=items;
 }
 const chosen=available[Math.floor(Math.random()*available.length)];
 seen.add(chosen.id);
 saveState();
 renderChallenge(chosen);
}
function chooseCategory(which){
 mode=which;
 nextChallenge();
}
$('all').addEventListener('click',()=>chooseCategory('all'));
$('draw').addEventListener('click',()=>chooseCategory('draw'));
$('mime').addEventListener('click',()=>chooseCategory('mime'));
$('questions').addEventListener('click',()=>chooseCategory('questions'));
$('next').addEventListener('click',()=>{if(active)nextChallenge();else chooseCategory('all');});
$('success').addEventListener('click',()=>{
 if(!active){chooseCategory('all');return;}
 done.add(active.id);
 saveState();
 updateProgress();
 nextChallenge();
});
$('adult').addEventListener('click',()=>{
 if(helpOpen){closeHelp();return;}
 let message='Alege una dintre cele patru categorii pentru a începe.';
 if(active){
  if(active.cat==='Desen')message='Încurajează copilul să deseneze: '+(active.task||active.label)+'. Lasă-l să creeze în ritmul lui.';
  else if(active.cat==='Mimă')message='Încurajează copilul să mimeze fără cuvinte: '+(active.task||active.label)+'. Ceilalți pot ghici!';
  else message='Citește întrebarea cu voce tare și lasă copilul să răspundă în ritmul lui. Răspuns orientativ: '+(active.answer||'Acceptă răspunsul copilului și discutați împreună.');
 }
 $('adult-message').textContent=message;
 $('adult-message').style.display='flex';
 helpOpen=true;
});
loadState();
updateProgress();
renderChallenge(null);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
 navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Service worker indisponibil:',err));
}
// Fail loudly during development if the content inventory is incomplete.
if(BANK.length!==600 || new Set(BANK.map(c=>c.id)).size!==600) console.error('Inventarul trebuie să conțină 600 de ID-uri unice.');
</script>
